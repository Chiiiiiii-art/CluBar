services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clubar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clubar
    ports:
      - "5432:5432"
    volumes:
      - clubar_pgdata:/var/lib/postgresql/data

volumes:
  clubar_pgdata:
